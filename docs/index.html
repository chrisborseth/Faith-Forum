<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Common Thread</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#252a2c;background:#e9ebec}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #8a9398;background:#fff;color:#202527;padding:9px 12px;border-radius:3px}button.primary{background:#25323a;color:white}button:hover{filter:brightness(.95)}button:disabled{opacity:.45;cursor:default}input,textarea{width:100%;border:1px solid #b9c0c3;padding:10px;background:#fff;border-radius:2px}textarea{resize:vertical;min-height:95px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:100dvh;max-width:1500px;margin:auto;background:#fff;border-left:1px solid #ccd0d2;border-right:1px solid #ccd0d2}.nav{background:#f2f3f3;border-right:1px solid #cdd1d2;display:flex;flex-direction:column;min-height:0}.brand{padding:23px 17px;font-size:15px;font-weight:800;letter-spacing:.12em;border-bottom:1px solid #cdd1d2}.small{color:#707a80;font-size:11px;letter-spacing:.06em}.section{padding:19px 13px 10px;font-weight:700;font-size:11px;letter-spacing:.1em}.threads{overflow:auto;flex:1}.thread{width:100%;text-align:left;border:0;border-bottom:1px solid #dfe2e3;border-radius:0;background:transparent;padding:14px;display:block}.thread.active{background:#dce3e6;border-left:3px solid #364e5c;padding-left:11px}.thread strong{display:block;font-size:13px;margin-bottom:6px}.thread span{font-size:11px;color:#738088}.sidebottom{padding:13px;border-top:1px solid #cdd1d2}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{display:flex;justify-content:space-between;align-items:center;min-height:64px;padding:12px 22px;border-bottom:1px solid #d5d9db}.toolbar h1{font-size:18px;margin:0}.content{overflow:auto;flex:1;padding:23px;scroll-behavior:smooth}.message{padding:19px 0;border-bottom:1px solid #e1e4e5}.messagehead{display:flex;justify-content:space-between;gap:15px}.message .sender{font-size:14px;font-weight:700}.message .date{font-size:11px;color:#768087;margin-top:5px}.message p{white-space:pre-wrap;line-height:1.55;font-size:14px}.trash{border:none;background:transparent;color:#68767d;padding:2px 7px}.compose{border-top:1px solid #d5d9db;padding:15px 22px;background:#f8f9f9}.line{display:flex;align-items:center;gap:12px;margin:7px 0}.line label{width:63px;flex:none;font-weight:700;font-size:11px;color:#5c676c}.line input{flex:1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.muted{color:#718087;font-size:13px}.gate{position:fixed;inset:0;background:#19232a;display:flex;align-items:center;justify-content:center;z-index:10}.gatebox{width:min(370px,90vw);background:#f8f9f9;padding:32px;box-shadow:0 18px 50px #0005}.gatebox h1{font-size:20px;letter-spacing:.12em}.gatebox p{font-size:13px;line-height:1.5;color:#667179}.gatebox button{width:100%;margin-top:12px}.error{color:#9e342f;font-size:12px;min-height:17px}.hidden{display:none!important}.mobileback{display:none}@media(max-width:680px){.shell{grid-template-columns:1fr}.nav{display:none}.shell.listing .nav{display:flex}.shell.listing .main{display:none}.mobileback{display:inline-block}.toolbar{padding:12px}.content{padding:14px}.compose{padding:12px}.brand{padding:20px}.line label{width:47px}}
</style></head><body><div class="gate" id="gate"><div class="gatebox"><h1>COMMON THREAD</h1><p>PRIVATE GROUP CORRESPONDENCE<br>Scripture · Reflection · Brotherhood</p><form id="login"><label class="small">SHARED PASSCODE</label><input type="password" id="pass" required autocomplete="off"><button class="primary">OPEN INBOX</button></form><p class="error" id="loginerr"></p></div></div><div class="shell listing" id="shell"><aside class="nav"><div class="brand">✉ COMMON THREAD</div><div class="section">INBOX / THREADS</div><div class="threads" id="threadlist"></div><div class="sidebottom"><button class="primary" id="newthread" style="width:100%">+ COMPOSE NEW THREAD</button></div></aside><section class="main"><header class="toolbar"><div><button class="mobileback" id="back">← Inbox</button><h1 id="subject">Select a thread</h1><span class="small" id="scripture"></span></div><button id="delthread" class="hidden">Delete thread</button></header><div class="content" id="messages"><p class="muted">Choose a conversation in the sidebar, or compose a new one.</p></div><form class="compose hidden" id="composer"><div class="line"><label>FROM</label><input id="author" maxlength="60" placeholder="Your name" required></div><div class="line" id="subjectrow"><label>SUBJECT</label><input id="newsubject" maxlength="140" placeholder="Conversation subject"></div><div class="line" id="scripturerow"><label>PASSAGE</label><input id="newscripture" maxlength="120" placeholder="Optional Scripture reference"></div><div class="line"><label>MESSAGE</label><textarea id="messagebody" maxlength="10000" placeholder="Write your message…" required></textarea></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">SEND</button></div><p class="error" id="posterr"></p></form></section></div><script src="config.js"></script><script>
const API=window.COMMON_THREAD_API||'https://REPLACE-ME.workers.dev';let token=sessionStorage.getItem('ct_token')||'',selected=null,isNew=false;const $=id=>document.getElementById(id);
const clean=s=>{let x=document.createElement('span');x.textContent=s??'';return x.innerHTML};
const when=s=>new Date(s).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
async function call(path,method='GET',data){if(API.includes('REPLACE-ME'))throw Error('The group backend is not connected yet. See README for setup.');let r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:data?JSON.stringify(data):undefined});let v=await r.json().catch(()=>({}));if(r.status===401&&path!=='/auth'){token='';sessionStorage.removeItem('ct_token');$('gate').classList.remove('hidden')}if(!r.ok)throw Error(v.error||'Request failed');return v}
function setScreen(list){$('shell').classList.toggle('listing',list)}
async function list(){const d=await call('/threads');$('threadlist').innerHTML=d.threads.length?d.threads.map(t=>'<button class="thread '+(t.id===selected?'active':'')+'" data-id="'+clean(t.id)+'"><strong>'+clean(t.subject)+'</strong><span>'+t.message_count+' messages · '+when(t.updated_at)+'</span></button>').join(''):'<p class="muted" style="padding:15px">No conversations yet.</p>';$('threadlist').querySelectorAll('button').forEach(el=>el.onclick=()=>openThread(el.dataset.id))}
async function openThread(id){selected=id;isNew=false;setScreen(false);let d=await call('/threads/'+id);$('subject').textContent=d.thread.subject;$('scripture').textContent=d.thread.scripture||'';$('delthread').classList.remove('hidden');$('composer').classList.remove('hidden');$('subjectrow').classList.add('hidden');$('scripturerow').classList.add('hidden');$('messages').innerHTML=d.messages.map(m=>'<article class="message"><div class="messagehead"><div><div class="sender">FROM: '+clean(m.author)+'</div><div class="date">'+when(m.created_at)+'</div></div><button class="trash" data-mid="'+clean(m.id)+'" title="Delete message">✕ Delete</button></div><p>'+clean(m.body)+'</p></article>').join('');$('messages').querySelectorAll('[data-mid]').forEach(el=>el.onclick=()=>removeMessage(el.dataset.mid));$('messagebody').value='';await list()}
function newThread(){selected=null;isNew=true;setScreen(false);$('subject').textContent='New conversation';$('scripture').textContent='';$('messages').innerHTML='<p class="muted">Start a new Scripture discussion, ask a question, or share an encouragement.</p>';$('composer').classList.remove('hidden');$('subjectrow').classList.remove('hidden');$('scripturerow').classList.remove('hidden');$('delthread').classList.add('hidden');$('newsubject').required=true;$('messagebody').value=''}
async function removeMessage(id){if(!confirm('Delete this message for everyone? This cannot be undone.'))return;try{await call('/messages/'+id,'DELETE');try{await openThread(selected)}catch{selected=null;setScreen(true);await list()}}catch(e){alert(e.message)}}
$('delthread').onclick=async()=>{if(!selected||!confirm('Delete this entire thread and all replies for everyone?'))return;try{await call('/threads/'+selected,'DELETE');selected=null;setScreen(true);await list()}catch(e){alert(e.message)}};
$('login').onsubmit=async e=>{e.preventDefault();$('loginerr').textContent='';try{token=(await call('/auth','POST',{passcode:$('pass').value})).token;sessionStorage.setItem('ct_token',token);$('pass').value='';$('gate').classList.add('hidden');await list()}catch(e){$('loginerr').textContent=e.message}};
$('composer').onsubmit=async e=>{e.preventDefault();$('posterr').textContent='';let author=$('author').value.trim(),body=$('messagebody').value.trim();if(!author||!body)return;localStorage.setItem('ct_name',author);try{if(isNew){const d=await call('/threads','POST',{author,body,subject:$('newsubject').value,scripture:$('newscripture').value});await openThread(d.id)}else{await call('/threads/'+selected+'/messages','POST',{author,body});await openThread(selected)}}catch(e){$('posterr').textContent=e.message}};
$('newthread').onclick=newThread;$('back').onclick=()=>setScreen(true);$('cancel').onclick=()=>{if(isNew){setScreen(true);$('composer').classList.add('hidden')}else $('messagebody').value=''};$('author').value=localStorage.getItem('ct_name')||'';if(token){$('gate').classList.add('hidden');list().catch(()=>{$('gate').classList.remove('hidden')})}
</script></body></html>
